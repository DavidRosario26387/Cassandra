name: Weekly refresh

# Recomputes the screen (scores + fresh prices + valuation) and commits the new
# dashboard.json into the frontend. Render's static site auto-deploys on push.
# No backend involved — GitHub's runner does the heavy lifting (plenty of RAM
# and reliable network), then hands the app a static file.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write # needs to commit the regenerated JSON

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Recompute the screen
        working-directory: backend
        run: python pipeline.py

      - name: Publish JSON into the frontend
        run: |
          cp backend/data/dashboard.json frontend/public/dashboard.json
          cp backend/data/status.json   frontend/public/status.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/dashboard.json frontend/public/status.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
            echo "Pushed refreshed data."
          fi
