# Render Blueprint — one free static site, no backend.
#
# The app reads its data from a static /dashboard.json (in frontend/public,
# copied into the build). GitHub Actions recomputes that JSON weekly and commits
# it (.github/workflows/weekly-refresh.yml); Render auto-deploys on push.
#
# In Render: New -> Blueprint -> point at this repo.
services:
  - type: web
    name: compounder-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback. Real files (assets, /dashboard.json) are served directly;
      # only unknown paths fall through to index.html for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
