# Render Blueprint - deploys both services at once.
# In Render: New -> Blueprint -> point at this repo. It reads this file.
services:
  # ---------- Backend: API + weekly scheduler ----------
  - type: web
    name: compounder-api
    runtime: python
    rootDir: backend
    plan: free               # no credit card; sleeps when idle, recomputes on boot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: REFRESH_TOKEN
        generateValue: true          # secret to protect POST /api/refresh
      - key: ALLOWED_ORIGINS
        sync: false                  # set to your frontend URL after first deploy
    # No persistent disk on free: DATA_DIR defaults to ./data (ephemeral). The
    # app recomputes on boot if the dashboard is missing, so a cold start just
    # rebuilds it. The GitHub Actions weekly job keeps the data fresh.

  # ---------- Frontend: React (Vite) static site ----------
  - type: web
    name: compounder-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the build. Set to your backend URL after the API deploys.
      - key: VITE_API_BASE
        value: https://compounder-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA: all routes -> index.html

# ---------- Optional: a dedicated weekly Cron Job ----------
